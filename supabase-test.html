<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>matChi | Test Supabase</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      background: #10170d;
      color: #f5f1df;
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 60px auto;
      padding: 20px;
    }

    .card {
      background: #1c2616;
      padding: 28px;
      border-radius: 14px;
      border: 1px solid #46562d;
    }

    h1 {
      color: #a6b66a;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      margin: 7px 0;
      padding: 12px;
      background: #11180e;
      color: white;
      border: 1px solid #59683d;
      border-radius: 7px;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      border: 0;
      border-radius: 7px;
      background: #728542;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    #resultado {
      margin-top: 20px;
      padding: 15px;
      background: #11180e;
      border-radius: 7px;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>

<div class="card">

  <h1>matChi MAT/300</h1>

  <p>Prueba de conexión con Supabase</p>

  <input
    id="email"
    type="email"
    placeholder="Correo"
  >

  <input
    id="password"
    type="password"
    placeholder="Contraseña"
  >

  <button onclick="iniciarSesion()">
    Iniciar sesión
  </button>

  <button onclick="consultarPerfil()">
    Consultar mi perfil
  </button>

  <button onclick="cerrarSesion()">
    Cerrar sesión
  </button>

  <div id="resultado">
    Esperando prueba...
  </div>

</div>


<script>

const SUPABASE_URL =
  'https://hbogmsmwsplxtnlaoine.supabase.co';

const SUPABASE_PUBLISHABLE_KEY =
  'sb_publishable_JYxDOr8OWC9LCPIkZ0isAw_mmWXuwJt';


const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY,
  {
    auth: {
      persistSession: true,
      autoRefreshToken: true,
      detectSessionInUrl: true
    }
  }
);


const resultado =
  document.getElementById('resultado');


async function iniciarSesion() {

  const email =
    document.getElementById('email').value;

  const password =
    document.getElementById('password').value;


  const { data, error } =
    await db.auth.signInWithPassword({
      email,
      password
    });


  if (error) {

    resultado.textContent =
      'ERROR LOGIN:\n' + error.message;

    return;
  }


  resultado.textContent =
    'LOGIN CORRECTO\n\n' +
    'Usuario:\n' +
    data.user.email +
    '\n\nUID:\n' +
    data.user.id;
}


async function consultarPerfil() {

  const {
    data: { user },
    error: userError
  } = await db.auth.getUser();


  if (userError || !user) {

    resultado.textContent =
      'No hay usuario autenticado.';

    return;
  }


  const { data, error } =
    await db
      .from('perfiles')
      .select('email,nombre,rol,activo')
      .eq('id', user.id)
      .single();


  if (error) {

    resultado.textContent =
      'ERROR PERFIL:\n' +
      error.message;

    return;
  }


  resultado.textContent =
    'CONEXIÓN EXITOSA\n\n' +
    'Email: ' + data.email +
    '\nNombre: ' + data.nombre +
    '\nRol: ' + data.rol +
    '\nActivo: ' + data.activo;
}


async function cerrarSesion() {

  await db.auth.signOut();

  resultado.textContent =
    'Sesión cerrada.';
}

</script>

</body>
</html>
