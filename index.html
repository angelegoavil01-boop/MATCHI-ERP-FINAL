<style>
:root{
  --matcha-900:#2E3317; --matcha-800:#4B5429; --matcha-700:#5C6633; --matcha-600:#75833F;
  --matcha-500:#8FA05A; --matcha-300:#C3CE9C; --matcha-100:#EEF0DE;
  --cream:#FBF7EA; --paper:#FFFEF8; --panel:#FFFEF8; --ink:#282B18; --ink-soft:#6B6D53;
  --line:#E3DCC0; --line-soft:#F1EDDA;
  --coral:#E3937C; --amber:#B5791A; --red:#B42318; --blue:#2F6B8F;
  --ok-bg:#EBEFD9; --warn-bg:#FBF0D7; --bad-bg:#FBE4E1; --info-bg:#E3EDF3;
  --shadow:0 1px 2px rgba(46,51,23,.10), 0 6px 18px rgba(46,51,23,.06);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
:root:not([data-theme="light"]){ }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --cream:#171A0F; --paper:#1F2315; --panel:#1F2315; --ink:#ECEADC; --ink-soft:#A6A88C;
    --line:#39401F; --line-soft:#2A2E19; --matcha-100:#333A1C; --matcha-300:#8FA05A;
    --ok-bg:#2C3319; --warn-bg:#3A2F14; --bad-bg:#3A1E1B; --info-bg:#1C2C36;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --cream:#171A0F; --paper:#1F2315; --panel:#1F2315; --ink:#ECEADC; --ink-soft:#A6A88C;
  --line:#39401F; --line-soft:#2A2E19; --matcha-100:#333A1C; --matcha-300:#8FA05A;
  --ok-bg:#2C3319; --warn-bg:#3A2F14; --bad-bg:#3A1E1B; --info-bg:#1C2C36;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.25);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;height:100%;background:var(--cream);color:var(--ink);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;
}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--matcha-500);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- Shell bar ---------- */
.shell{
  background:var(--matcha-900);color:#F0F4E6;display:flex;align-items:center;gap:14px;
  padding:0 14px;height:48px;flex:0 0 auto;position:sticky;
  top:env(safe-area-inset-top,0px);z-index:40;
}
.brandmark{display:flex;align-items:center;gap:9px;cursor:pointer;background:none;border:0;padding:4px 6px;border-radius:6px}
.brandmark:hover{background:rgba(255,255,255,.08)}
.brandmark img{display:block;width:26px;height:26px;object-fit:contain;background:var(--matcha-300);border-radius:7px;padding:3px}
.brandname{font-weight:700;letter-spacing:-.01em;font-size:15px}
.sysid{font-size:11px;color:#A8C686;letter-spacing:.06em}
.brandstrip{display:flex;justify-content:center;margin:2px 0 20px}
.brandstrip img{height:132px;width:auto;display:block}
.cmdwrap{margin-left:auto;display:flex;align-items:center;gap:8px}
.cmd{
  background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.18);color:#F0F4E6;
  border-radius:6px;padding:6px 10px;width:150px;font-size:13px;
}
.cmd::placeholder{color:#93A67E}
.cmd:focus{background:rgba(255,255,255,.18);outline:none;border-color:var(--matcha-300)}
.avatar{
  width:30px;height:30px;border-radius:50%;background:var(--matcha-500);color:#12200A;
  display:grid;place-items:center;font-weight:700;font-size:12px;flex:0 0 auto;border:0;cursor:pointer;
}
.icobtn{background:none;border:0;color:#C6D6AE;padding:6px;border-radius:6px;cursor:pointer;line-height:0}
.icobtn:hover{background:rgba(255,255,255,.10);color:#fff}

/* ---------- Page frame ---------- */
main{flex:1 1 auto;overflow-y:auto;overflow-x:hidden}
.wrap{max-width:1180px;margin:0 auto;padding:18px 16px 64px}
.crumb{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-soft);margin-bottom:10px;flex-wrap:wrap}
.crumb button{background:none;border:0;padding:0;color:var(--matcha-600);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
h1.page{font-size:22px;letter-spacing:-.02em;margin:0 0 2px;font-weight:650}
.page-sub{color:var(--ink-soft);margin:0 0 18px;font-size:13px}
.tcode-badge{
  display:inline-block;background:var(--matcha-100);color:var(--matcha-700);
  border-radius:4px;padding:1px 6px;font-size:11px;font-weight:600;letter-spacing:.04em;margin-right:8px;
  font-family:"IBM Plex Mono",monospace;
}

/* ---------- Launchpad ---------- */
.hero{
  background:linear-gradient(140deg,var(--matcha-800),var(--matcha-600) 70%,var(--matcha-500));
  color:#F2F7E8;border-radius:14px;padding:22px 24px;margin-bottom:24px;
  display:grid;grid-template-columns:1.2fr 1fr;gap:20px;align-items:center;
}
.hero h2{margin:0 0 6px;font-size:19px;font-weight:600;letter-spacing:-.01em}
.hero p{margin:0;color:#CFE0B6;font-size:13px;max-width:52ch}
.heroStats{display:flex;gap:22px;justify-content:flex-end;flex-wrap:wrap}
.heroStat b{display:block;font-size:26px;font-weight:650;letter-spacing:-.02em;line-height:1.1}
.heroStat span{font-size:11.5px;color:#BFD3A2}
.grp{margin-bottom:26px}
.grp h3{
  font-size:13px;font-weight:600;color:var(--ink-soft);margin:0 0 10px;
  display:flex;align-items:center;gap:10px;
}
.grp h3::after{content:"";flex:1;height:1px;background:var(--line)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:12px}
.tile{
  background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 13px;
  text-align:left;cursor:pointer;min-height:104px;display:flex;flex-direction:column;
  box-shadow:var(--shadow);transition:border-color .12s,transform .12s;
}
.tile:hover{border-color:var(--matcha-500);transform:translateY(-1px)}
.tile .tc{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--matcha-600);font-weight:600;letter-spacing:.05em}
.tile .tt{font-weight:600;font-size:13.5px;margin-top:2px}
.tile .tv{margin-top:auto;font-size:21px;font-weight:650;letter-spacing:-.02em}
.tile .tl{font-size:11.5px;color:var(--ink-soft)}
.tile.alert{border-color:var(--red)}
.tile.alert .tv{color:var(--red)}
.tile.warn{border-color:var(--amber)}
.tile.warn .tv{color:var(--amber)}

/* ---------- Cards / tables ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}
.card>header{padding:11px 14px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card>header h4{margin:0;font-size:14px;font-weight:600}
.card>header .hint{font-size:12px;color:var(--ink-soft)}
.card .body{padding:14px}
.tablescroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:12.5px;min-width:520px}
th{
  text-align:left;font-weight:600;color:var(--ink-soft);font-size:11.5px;
  padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--line-soft);
}
td{padding:8px 10px;border-bottom:1px solid var(--line-soft);white-space:nowrap;vertical-align:top}
tbody tr:hover td{background:var(--matcha-100)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.total td{font-weight:650;background:var(--line-soft);border-top:2px solid var(--line)}
.doclink{background:none;border:0;padding:0;color:var(--matcha-600);cursor:pointer;font-family:"IBM Plex Mono",monospace;font-size:12px;text-decoration:underline;text-underline-offset:2px}
.empty{padding:26px 14px;text-align:center;color:var(--ink-soft);font-size:13px}

/* ---------- Status pills ---------- */
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--matcha-700)}
.pill.warn{background:var(--warn-bg);color:var(--amber)}
.pill.bad{background:var(--bad-bg);color:var(--red)}
.pill.info{background:var(--info-bg);color:var(--blue)}
.pill.mute{background:var(--line-soft);color:var(--ink-soft)}
.pill.dev{background:var(--info-bg);color:var(--blue)}
:root[data-theme="dark"] .pill.ok,:root[data-theme="dark"] .pill.warn{color:#ECEADC}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pill.ok,:root:not([data-theme="light"]) .pill.warn{color:#ECEADC}}

/* ---------- Forms ---------- */
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px 16px}
label.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink-soft);font-weight:500}
label.fld input,label.fld select,label.fld textarea{
  font:inherit;font-size:13.5px;color:var(--ink);background:var(--paper);
  border:1px solid var(--line);border-bottom:2px solid var(--matcha-300);border-radius:5px 5px 0 0;padding:7px 9px;width:100%;
}
label.fld input:focus,label.fld select:focus{outline:none;border-bottom-color:var(--matcha-600);background:var(--matcha-100)}
label.fld.req>span::after{content:" *";color:var(--coral)}
.actions{display:flex;gap:8px;flex-wrap:wrap;padding:12px 14px;border-top:1px solid var(--line-soft);background:var(--line-soft)}
.btn{
  border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:7px 14px;
  font-size:13px;font-weight:550;cursor:pointer;
}
.btn:hover{border-color:var(--matcha-500)}
.btn.primary{background:var(--matcha-700);border-color:var(--matcha-700);color:#F2F7E8}
.btn.primary:hover{background:var(--matcha-600)}
.btn.ghost{background:none;border-color:transparent;color:var(--matcha-600)}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ---------- Message bar ---------- */
.msgbar{
  position:fixed;left:0;right:0;bottom:0;padding:9px 16px;
  padding-bottom:calc(9px + env(safe-area-inset-bottom,0px));
  background:var(--matcha-700);color:#F2F7E8;font-size:13px;display:flex;align-items:center;gap:10px;z-index:50;
  transform:translateY(120%);transition:transform .18s ease-out;
}
.msgbar.show{transform:translateY(0)}
.msgbar.err{background:var(--red)}
.msgbar b{font-weight:600}
.msgbar .x{margin-left:auto;background:none;border:0;color:inherit;cursor:pointer;font-size:16px;line-height:1}

/* ---------- Doc flow ---------- */
.flow{display:flex;flex-direction:column;gap:0}
.flownode{display:flex;gap:12px;align-items:flex-start;padding:2px 0}
.flowrail{display:flex;flex-direction:column;align-items:center;width:22px;flex:0 0 22px}
.flowdot{width:11px;height:11px;border-radius:50%;background:var(--matcha-500);margin-top:6px;flex:0 0 auto}
.flowline{width:2px;flex:1;background:var(--line);min-height:16px}
.flowbody{padding-bottom:12px;flex:1;min-width:0}
.flowbody .t{font-size:12.5px;color:var(--ink-soft)}
.flowbody .n{font-weight:600}

/* ---------- Chart ---------- */
.chartbox{overflow-x:auto}
.chartbox svg{display:block;min-width:460px;width:100%;height:auto}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-soft);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;box-shadow:var(--shadow)}
.kpi .l{font-size:11.5px;color:var(--ink-soft)}
.kpi .v{font-size:23px;font-weight:650;letter-spacing:-.02em;margin-top:2px}
.kpi .d{font-size:11.5px;color:var(--ink-soft);margin-top:2px}

.note{background:var(--info-bg);border-left:3px solid var(--blue);padding:10px 12px;border-radius:0 6px 6px 0;font-size:12.5px;margin-bottom:14px}
.note.warn{background:var(--warn-bg);border-left-color:var(--amber)}
.note.bad{background:var(--bad-bg);border-left-color:var(--red)}
.note b{font-weight:600}

.bar{height:7px;background:var(--line-soft);border-radius:4px;overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;background:var(--matcha-500);border-radius:4px}

/* ---------- App nav (canvas-app style) ---------- */
.appnav{
  position:fixed;left:0;right:0;bottom:0;z-index:60;
  background:var(--panel);border-top:1px solid var(--line);
  display:flex;justify-content:space-around;align-items:stretch;
  padding-bottom:env(safe-area-inset-bottom,0px);
  box-shadow:0 -2px 12px rgba(38,51,26,.07);
}
.appnav button{
  flex:1 1 0;background:none;border:0;cursor:pointer;padding:7px 2px 8px;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:10.5px;color:var(--ink-soft);font-weight:550;border-top:2px solid transparent;margin-top:-1px;
}
.appnav button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.appnav button.on{color:var(--matcha-600);border-top-color:var(--matcha-600)}
.appnav .badge{
  position:absolute;transform:translate(13px,-4px);background:var(--coral);color:#3A1A14;
  border-radius:999px;font-size:9.5px;font-weight:700;padding:0 5px;line-height:15px;min-width:16px;text-align:center;
}
.msgbar{bottom:60px}
.wrap{padding-bottom:88px}
@media (min-width:900px){
  .appnav{
    left:0;top:48px;bottom:0;right:auto;width:86px;flex-direction:column;justify-content:flex-start;
    border-top:0;border-right:1px solid var(--line);padding-top:10px;box-shadow:none;
  }
  .appnav button{flex:0 0 auto;padding:11px 4px;border-top:0;border-left:2px solid transparent;margin:0}
  .appnav button.on{border-left-color:var(--matcha-600);background:var(--matcha-100)}
  main{margin-left:86px}
  .msgbar{left:86px;bottom:0}
  .wrap{padding-bottom:64px}
}

/* ---------- MD04 projection ---------- */
.proj{display:flex;align-items:flex-end;gap:5px;height:130px;padding-top:8px}
.projcol{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;min-width:0}
.projcol .b{width:100%;border-radius:3px 3px 0 0;background:var(--matcha-500);min-height:2px}
.projcol.neg .b{background:var(--red)}
.projcol.low .b{background:var(--amber)}
.projcol .l{font-size:9.5px;color:var(--ink-soft);white-space:nowrap}
.projcol .q{font-size:10.5px;font-weight:600;font-family:"IBM Plex Mono",monospace}

@media (max-width:760px){
  .hero{grid-template-columns:1fr;gap:16px}
  .heroStats{justify-content:flex-start;gap:18px}
  .cmd{width:96px}
  .wrap{padding:14px 12px 72px}
}


/* ---------- Autenticación Supabase ---------- */
.authgate{
  position:fixed;inset:0;z-index:1000;background:var(--cream);
  display:flex;align-items:center;justify-content:center;padding:24px;
}
.authgate.hidden{display:none}
.authcard{
  width:min(430px,100%);background:var(--panel);border:1px solid var(--line);
  border-radius:16px;box-shadow:var(--shadow);padding:28px;
}
.authbrand{font-size:30px;font-weight:700;color:var(--matcha-600);letter-spacing:-.7px;margin-bottom:4px}
.authbrand span{font-family:"IBM Plex Mono",monospace;font-size:15px;font-weight:500;color:var(--ink-soft);letter-spacing:0}
.authsubtitle{font-size:13px;color:var(--ink-soft);margin-bottom:22px}
.authfield{display:flex;flex-direction:column;gap:5px;margin:12px 0;font-size:12px;font-weight:600;color:var(--ink-soft)}
.authfield input{
  width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:8px;
  background:var(--paper);color:var(--ink);font:inherit;outline:none;
}
.authfield input:focus{border-color:var(--matcha-500);box-shadow:0 0 0 2px color-mix(in srgb,var(--matcha-500) 20%,transparent)}
.authlogin{
  width:100%;margin-top:8px;padding:12px 14px;border:0;border-radius:8px;
  background:var(--matcha-600);color:#fff;font-weight:700;cursor:pointer;
}
.authlogin:hover{background:var(--matcha-700)}
.authlogin:disabled{opacity:.55;cursor:wait}
.authmsg{min-height:20px;margin-top:12px;font-size:12px;color:var(--red);white-space:pre-wrap}
.authfoot{margin-top:15px;padding-top:14px;border-top:1px solid var(--line-soft);font-size:11px;color:var(--ink-soft);line-height:1.5}
body.auth-locked > header,
body.auth-locked > nav,
body.auth-locked > main{pointer-events:none;user-select:none;filter:blur(2px);opacity:.45}

/* ---------- derivaciones ---------- */
function batches(){
  return state.po.filter(p=>p.status==='Recibido').map(p=>{
    const id=CFG.prefix+'-'+p.expiry.replace(/-/g,'')+'-'+p.ref;
    const issued=state.so.filter(s=>s.status==='Entregado').reduce((t,s)=>
      t+s.alloc.filter(a=>a.batch===id).reduce((x,a)=>x+a.qty,0),0);
    const reserved=state.so.filter(s=>s.status==='Pendiente').reduce((t,s)=>
      t+s.alloc.filter(a=>a.batch===id).reduce((x,a)=>x+a.qty,0),0);
    const stock=Math.max(0,p.qtyRec-issued);
    const dte=days(TODAY,p.expiry);
    return {id,po:p.id,ref:p.ref,supplier:p.supplier,cost:p.price,expiry:p.expiry,grDate:p.grDate,
      received:p.qtyRec,issued,reserved,stock,free:Math.max(0,stock-reserved),dte,
      expStatus: dte<0?'VENCIDO' : dte<=CFG.expiryAlert?'POR VENCER':'VIGENTE',
      value:stock*p.price};
  });
}
function batchById(id){return batches().find(b=>b.id===id)}
function fefo(qty,date){
  const av=batches().filter(b=>b.free>0 && b.grDate<=date && b.expiry>=date)
    .sort((a,b)=>a.expiry.localeCompare(b.expiry)||a.grDate.localeCompare(b.grDate));
  const out=[];let rest=qty;
  for(const b of av){ if(rest<=0)break; const t=Math.min(rest,b.free); out.push({batch:b.id,qty:t,cost:b.cost,expiry:b.expiry}); rest-=t;}
  return {alloc:out,short:rest};
}
function ownAllocQty(s,batchId){
  return (s.alloc||[]).filter(a=>a.batch===batchId).reduce((t,a)=>t+Number(a.qty||0),0);
}
function availableForOrder(s,b){
  return Math.max(0,Number(b.free||0)+ownAllocQty(s,b.id));
}
function eligibleBatchesForOrder(s,date){
  const d=date||TODAY;
  return batches()
    .filter(b=>b.grDate<=d && b.expiry>=d && availableForOrder(s,b)>0)
    .sort((a,b)=>a.expiry.localeCompare(b.expiry)||a.grDate.localeCompare(b.grDate));
}
function fefoForOrder(s,date){
  const av=eligibleBatchesForOrder(s,date);
  const out=[];let rest=Number(s.qty||0);
  for(const b of av){
    if(rest<=0)break;
    const t=Math.min(rest,availableForOrder(s,b));
    if(t>0)out.push({batch:b.id,qty:t,cost:b.cost,expiry:b.expiry});
    rest-=t;
  }
  return {alloc:out,short:rest};
}
function soCost(s){return s.alloc.reduce((t,a)=>{const b=batchById(a.batch);return t+a.qty*(b?b.cost:0)},0)}
function soNet(s){return s.qty*s.price-(s.discount||0)}
function soMargin(s){return s.status==='Entregado' ? soNet(s)-soCost(s)-(s.freight||0) : 0}
function stockTotal(){return batches().reduce((t,b)=>t+b.stock,0)}
function stockValue(){return batches().reduce((t,b)=>t+b.value,0)}
function openSO(){return state.so.filter(s=>s.status==='Pendiente')}
function openPO(){return state.po.filter(s=>s.status!=='Recibido')}

function kardex(){
  const rows=[];
  state.po.filter(p=>p.status==='Recibido').forEach(p=>rows.push({
    date:p.grDate,doc:p.grDoc,type:'ENTRADA',mvt:'101',ref:p.id,
    batch:CFG.prefix+'-'+p.expiry.replace(/-/g,'')+'-'+p.ref,
    partner:p.supplier,inQty:p.qtyRec,outQty:0,unit:p.price,value:p.qtyRec*p.price}));
  state.so.filter(s=>s.giDoc).forEach(s=>s.alloc.forEach(a=>{
    const b=batchById(a.batch);
    rows.push({date:s.giDate||s.date,doc:s.giDoc,type:'SALIDA',mvt:'601',ref:s.dlDoc,
      batch:a.batch,partner:s.customer,inQty:0,outQty:a.qty,unit:b?b.cost:0,value:-(a.qty*(b?b.cost:0))});
  }));
  state.so.filter(s=>s.status==='Devuelto').forEach(s=>s.alloc.forEach(a=>{
    const b=batchById(a.batch);
    rows.push({date:s.returnDate,doc:s.returnDoc,type:'ENTRADA',mvt:'202',ref:s.id,
      batch:a.batch,partner:s.customer,inQty:a.qty,outQty:0,unit:b?b.cost:0,value:a.qty*(b?b.cost:0)});
  }));
  rows.sort((a,b)=>a.date.localeCompare(b.date)||a.doc.localeCompare(b.doc));
  let bal=0,val=0;
  rows.forEach(r=>{bal+=r.inQty-r.outQty;val+=r.value;r.bal=bal;r.balValue=val});
  return rows;
}
function fefoDeviations(){
  const out=[];const stockAt={};
  const ev=[];
  state.po.filter(p=>p.status==='Recibido').forEach(p=>ev.push({d:p.grDate,k:'in',b:CFG.prefix+'-'+p.expiry.replace(/-/g,'')+'-'+p.ref,q:p.qtyRec,exp:p.expiry}));
  state.so.filter(s=>s.status==='Entregado').forEach(s=>ev.push({d:s.giDate||s.date,k:'out',so:s}));
  ev.sort((a,b)=>a.d.localeCompare(b.d)|| (a.k==='in'?-1:1));
  const expOf={};
  ev.forEach(e=>{
    if(e.k==='in'){stockAt[e.b]=(stockAt[e.b]||0)+e.q;expOf[e.b]=e.exp;return}
    const used=new Set(e.so.alloc.map(a=>a.batch));
    const earliest=Object.keys(stockAt).filter(b=>stockAt[b]>0).sort((a,b)=>expOf[a].localeCompare(expOf[b]))[0];
    if(earliest && !used.has(earliest)){
      const u=[...used][0];
      if(u && expOf[u] && expOf[earliest] < expOf[u])
        out.push({so:e.so.id,date:e.d,used:u,usedExp:expOf[u],should:earliest,shouldExp:expOf[earliest]});
    }
    e.so.alloc.forEach(a=>{stockAt[a.batch]=(stockAt[a.batch]||0)-a.qty});
  });
  return out;
}
function velocity(){
  const del=state.so.filter(s=>s.status==='Entregado');
  if(!del.length)return 0;
  const first=del.map(s=>s.date).sort()[0];
  const d=Math.max(1,days(first,TODAY)+1);
  return del.reduce((t,s)=>t+s.qty,0)/d;
}

function cancelSO(id,reason){

  if(!s||s.status!=='Pendiente')return false;
  s.status='Anulado';s.cancelDate=TODAY;s.cancelReason=reason||'Otro';

}
function returnSO(id,date,reason){
  const s=state.so.find(x=>x.id===id);
  if(!s||s.status!=='Entregado')return false;
  state.counters.rt++;
  s.status='Devuelto';s.returnDate=date||TODAY;s.returnDoc='65'+pad(state.counters.rt,8);s.returnReason=reason||'Otro';
  save();return true;
}

async function stopRealtime(){
  if(backend&&realtimeChannel){
    try{await backend.removeChannel(realtimeChannel)}catch(e){}
  }
  realtimeChannel=null;
}
async function subscribeRealtime(){
  await stopRealtime();
  if(!backend||!currentUser)return;

  realtimeChannel=backend
    .channel('matchi-erp-state')
    .on(
      'postgres_changes',
      {event:'*',schema:'public',table:'erp_state',filter:'id=eq.'+ERP_STATE_ID},
      payload=>{
        const data=payload.new&&payload.new.data;
        if(!data||!data.po||!data.so)return;
        state=data;
        if(state.params)Object.assign(CFG,state.params);
        try{localStorage.setItem('matchi-erp-v1-backup',JSON.stringify(state))}catch(e){}
        render();
        console.log('matChi Realtime: estado actualizado desde Supabase.');
      }
    )
    .subscribe(status=>{
      console.log('Supabase Realtime:',status);
      if(status==='SUBSCRIBED')setCloudStatus('CLOUD');
      if(status==='CHANNEL_ERROR'||status==='TIMED_OUT')setCloudStatus('CLOUD · RT ERROR');
    });
}

async function connect(){
  try{
    if(!window.supabase)throw new Error('No se pudo cargar la librería de Supabase.');

    if(!backend){
      backend=window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY,
        {
          auth:{
            persistSession:false,
            autoRefreshToken:true,
            detectSessionInUrl:false
          }
        }
      );
    }

    if(!authSubscription){
      const {data}=backend.auth.onAuthStateChange((event,session)=>{
        if(event==='SIGNED_OUT'){
          currentUser=null;
          currentProfile=null;
          appBooted=false;
          stopRealtime();
          showLogin('Sesión cerrada. Ingresa nuevamente tus credenciales.');
        }
        if(event==='TOKEN_REFRESHED'&&session?.user){
          currentUser=session.user;
        }
      });
      authSubscription=data&&data.subscription;
    }

    /* Seguridad solicitada: cada carga/entrada al ERP comienza bloqueada.
       La sesión NO se recupera desde caché ni localStorage. */
    currentUser=null;
    currentProfile=null;
    appBooted=false;
    await stopRealtime();
    showLogin('Ingresa tus credenciales para iniciar una nueva sesión.');
    return null;
  }catch(e){
    console.error('Supabase connect:',e);
    setCloudStatus('ERROR');
    showLogin('No se pudo conectar con Supabase. Revisa la conexión y la configuración.');
    return null;
  }
}

async function load(){
  if(!backend||!currentUser)throw new Error('No existe una sesión activa de Supabase.');

  const {data,error}=await backend
    .from('erp_state')
    .select('data,updated_at,updated_by')
    .eq('id',ERP_STATE_ID)
    .maybeSingle();

  if(error)throw error;

  if(data&&data.data&&data.data.po&&data.data.so){
    try{localStorage.setItem('matchi-erp-v1-backup',JSON.stringify(data.data))}catch(e){}
    console.log('matChi ERP: estado cargado desde Supabase.',data.updated_at);
    return data.data;
  }

  /* Primera inicialización: migra el estado local existente una sola vez.
     Después de creada erp_state/main, Supabase siempre tiene prioridad. */
  let initial=null;
  try{
    const raw=localStorage.getItem('matchi-erp-v1');
    if(raw){
      const d=JSON.parse(raw);
      if(d&&d.po&&d.so)initial=d;
    }
  }catch(e){}
  if(!initial)initial=JSON.parse(JSON.stringify(SEED));

  const {error:saveError}=await backend
    .from('erp_state')
    .insert({
      id:ERP_STATE_ID,
      data:initial,
      updated_at:new Date().toISOString(),
      updated_by:currentUser.id
    });
  if(saveError)throw saveError;

  try{localStorage.setItem('matchi-erp-v1-backup',JSON.stringify(initial))}catch(e){}
  console.log('matChi ERP: estado inicial creado en Supabase.');
  return initial;
}

async function save(){
  if(!backend||!currentUser){
    msg('Sesión cloud no disponible. El movimiento NO fue guardado.','err');
    showLogin('Tu sesión expiró. Inicia sesión nuevamente.');
    return false;
  }

  try{
    const {error}=await backend
      .from('erp_state')
      .upsert({
        id:ERP_STATE_ID,
        data:JSON.parse(JSON.stringify(state)),
        updated_at:new Date().toISOString(),
        updated_by:currentUser.id
      },{onConflict:'id'});

    if(error)throw error;
    try{localStorage.setItem('matchi-erp-v1-backup',JSON.stringify(state))}catch(e){}
    setCloudStatus('CLOUD');
    console.log('matChi ERP: sincronizado con Supabase.');
    return true;
  }catch(e){
    console.error('Supabase save:',e);
    msg('No se pudo guardar en la nube. El movimiento NO fue confirmado.','err');
    try{
      const remote=await load();
      if(remote&&remote.po&&remote.so){
        state=remote;
        if(state.params)Object.assign(CFG,state.params);
        render();
      }
    }catch(reloadError){
      console.error('No se pudo restaurar el estado remoto:',reloadError);
    }
    return false;
  }
}

async function activateCloudSession(user){
  currentUser=user;
  setCloudStatus('CONECTANDO');
  try{
    await loadCurrentProfile();
    const loaded=await load();
    state=loaded;
    if(state.params)Object.assign(CFG,state.params);
    render();
    await subscribeRealtime();
    appBooted=true;
    hideLogin();
    setCloudStatus('CLOUD');
    console.log('matChi ERP conectado como:',currentUser.email,'| rol:',currentProfile?.rol);
    return true;
  }catch(e){
    console.error('Activación cloud:',e);
    showLogin('Sesión válida, pero no se pudo cargar el ERP: '+(e.message||e));
    return false;
  }
}

async function loginERP(){
  const email=(document.getElementById('authEmail')?.value||'').trim();
  const password=document.getElementById('authPassword')?.value||'';
  const btn=document.getElementById('authLoginBtn');
  if(!email||!password){setAuthMsg('Ingresa correo y contraseña.');return}
  if(!backend)await connect();
  if(!backend){setAuthMsg('No hay conexión con Supabase.');return}

  try{
    if(btn){btn.disabled=true;btn.textContent='Ingresando...'}
    setAuthMsg('');
    const {data,error}=await backend.auth.signInWithPassword({email,password});
    if(error)throw error;
    if(!data.user)throw new Error('Supabase no devolvió un usuario válido.');
    const ok=await activateCloudSession(data.user);
    if(ok){
      const p=document.getElementById('authPassword');if(p)p.value='';
    }
  }catch(e){
    console.error('Login:',e);
    setAuthMsg(e.message||'No se pudo iniciar sesión.');
  }finally{
    if(btn){btn.disabled=false;btn.textContent='Iniciar sesión'}
  }
}

async function logoutERP(){
  if(!backend)return;
  try{await backend.auth.signOut()}catch(e){console.error('Logout:',e)}
}

function wireAuthUI(){
  const btn=document.getElementById('authLoginBtn');
  if(btn)btn.onclick=loginERP;
  ['authEmail','authPassword'].forEach(id=>{
    const n=document.getElementById(id);
    if(n)n.addEventListener('keydown',e=>{if(e.key==='Enter')loginERP()});
  });
}

  ZFLW:{t:'ZFLW',n:'Flujo de documentos'}
};
function go(t,p){route={t,...(p||{})};window.scrollTo(0,0);render()}
el('homeBtn').onclick=()=>go('HOME');
el('cmd').addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  const raw=e.target.value.trim().toUpperCase().replace(/^\/N/,'');
  e.target.value='';
  if(!raw)return;
  if(raw==='LOGOUT'||raw==='SALIR')return logoutERP();
  if(raw==='HOME'||raw==='SMEN')return go('HOME');
  if(TX[raw])return go(raw);
  const doc=findDoc(raw);
  if(doc)return go('ZFLW',{doc:raw});
  msg('Código de transacción <b>'+esc(raw)+'</b> no existe en MAT/300.','err');
});
el('themeBtn').onclick=()=>{
  const cur=document.documentElement.getAttribute('data-theme');
  const dark=window.matchMedia('(prefers-color-scheme: dark)').matches;
  const next=cur?(cur==='dark'?'light':'dark'):(dark?'light':'dark');
  document.documentElement.setAttribute('data-theme',next);
  try{localStorage.setItem('matchi-theme',next)}catch(e){}
};
el('userBtn').onclick=()=>{
  const n=esc((currentProfile&&currentProfile.nombre)||currentUser?.email||'Usuario');
  const r=esc((currentProfile&&currentProfile.rol)||'USUARIO');
  msg('Usuario <b>'+n+'</b> · Rol '+r+' · MAT/300 CLOUD · Para cerrar sesión escribe <b>/n LOGOUT</b>.');
};

function findDoc(id){
  const p=state.po.find(x=>x.id===id||x.grDoc===id);if(p)return{kind:'po',p};
  const s=state.so.find(x=>x.id===id||x.dlDoc===id||x.giDoc===id||x.returnDoc===id);if(s)return{kind:'so',s};
  return null;
}

  v.innerHTML=f();
  navbar();
  bind();
}

function navbar(){
  el('appnav').innerHTML=NAV.map(n=>{
    const c=n.b?n.b():0;
    return `<button data-nav="${n.k}" class="${n.g.includes(route.t)?'on':''}" title="${n.l}">
    ${c?`<span class="badge">${c}</span>`:''}
    <svg viewBox="0 0 24 24" aria-hidden="true">${n.i}</svg><span>${n.l}</span></button>`}).join('');
  document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>go(b.dataset.nav));
}
function head(code,extra){
  const t=TX[code];
  return `<div class="crumb"><button data-go="HOME">Launchpad</button><span>›</span><span>${esc(t.n)}</span></div>
  <h1 class="page"><span class="tcode-badge">${t.t}</span>${esc(t.n)}</h1>
  <p class="page-sub">${extra||''}</p>`;
}

/* ---------------- ME21N ---------------- */
function me21n(){
  return head('ME21N','El lote interno se genera solo, con el formato que ya usas: prefijo + fecha de vencimiento + número de pedido.')+`
  <div class="card">
    <header><h4>Datos de cabecera y posición</h4><span class="hint mono">Sociedad MATC · Centro 1000 · Almacén 0001</span></header>
    <div class="body"><div class="formgrid">
      <label class="fld req"><span>Proveedor</span><input id="f_sup" value="LIU NN RUICHAN"></label>
      <label class="fld req"><span>Fecha del pedido</span><input id="f_date" type="date" value="${TODAY}"></label>
      <label class="fld"><span>Material</span><input value="${CFG.materialTxt}" disabled></label>
      <label class="fld req"><span>Cantidad (pouch)</span><input id="f_qty" type="number" min="1" step="1" value="${route.qty||24}"></label>

function zflw(){
  const id=route.doc;
  if(!id){
    return head('ZFLW','Escribe cualquier número de documento en el campo de comandos y te muestro su cadena completa.')+`
    <div class="card"><header><h4>Documentos</h4></header><div class="tablescroll"><table>
    <thead><tr><th>Documento</th><th>Clase</th><th>Fecha</th><th>Interlocutor</th></tr></thead><tbody>
    ${state.po.map(p=>`<tr><td><button class="doclink" data-doc="${p.id}">${p.id}</button></td><td>Pedido de compra</td><td>${fdate(p.date)}</td><td>${esc(p.supplier)}</td></tr>`).join('')}
    ${state.so.map(s=>`<tr><td><button class="doclink" data-doc="${s.id}">${s.id}</button></td><td>Pedido de cliente</td><td>${fdate(s.date)}</td><td>${esc(s.customer)}</td></tr>`).join('')}
    </tbody></table></div></div>`;
  }
  const f=findDoc(id);
  if(!f)return head('ZFLW')+`<div class="card"><div class="empty">El documento ${esc(id)} no existe.</div></div>`;
  let nodes=[];
  if(f.kind==='po'){
    const p=f.p, lot=CFG.prefix+'-'+p.expiry.replace(/-/g,'')+'-'+p.ref;
    nodes.push({n:p.id,t:'Pedido de compra · '+p.supplier+' · '+N(p.qty)+' pouch a '+S(p.price),d:p.date});
    if(p.status==='Recibido'){
      nodes.push({n:p.grDoc,t:'Entrada de mercancía 101 · lote '+lot+' · '+N(p.qtyRec)+' pouch · '+S(p.qtyRec*p.price),d:p.grDate});
      const consumers=state.so.filter(s=>s.alloc.some(a=>a.batch===lot));
      consumers.forEach(s=>{
        const q=s.alloc.filter(a=>a.batch===lot).reduce((t,a)=>t+a.qty,0);
        nodes.push({n:s.id,t:'Pedido de cliente · '+s.customer+' · consume '+N(q)+' pouch de este lote',d:s.date,sub:true});
        if(s.status==='Entregado')nodes.push({n:s.dlDoc,t:'Entrega despachada · salida 601 doc '+s.giDoc,d:s.giDate||s.date,sub:true});
      });
      const b=batchById(lot);
      if(b)nodes.push({n:'Saldo del lote',t:N(b.stock)+' pouch en stock · '+S(b.value)+' · vence '+fdate(b.expiry),d:TODAY});
    }
  }else{
    const s=f.s;
    nodes.push({n:s.id,t:'Pedido de cliente · '+s.customer+' · '+N(s.qty)+' pouch a '+S(s.price)+' · '+esc(s.channel),d:s.date});
    s.alloc.forEach(a=>{
      const b=batchById(a.batch);
      const po=state.po.find(p=>CFG.prefix+'-'+p.expiry.replace(/-/g,'')+'-'+p.ref===a.batch);
      nodes.push({n:a.batch,t:'Lote determinado (FEFO) · '+N(a.qty)+' pouch a '+S(b?b.cost:0)+(po?' · origen pedido '+po.id:''),d:po?po.grDate:s.date,sub:true});
    });
    if(s.status==='Entregado'||s.status==='Devuelto'){
      nodes.push({n:s.dlDoc,t:'Entrega · despachada a '+(s.district||'—'),d:s.giDate||s.date});
      nodes.push({n:s.giDoc,t:'Salida de mercancía 601 · costo '+S(soCost(s)),d:s.giDate||s.date});
    }
    if(s.status==='Entregado'){
      nodes.push({n:'Resultado',t:'Venta neta '+S(soNet(s))+' − costo '+S(soCost(s))+' − delivery '+S(s.freight||0)+' = margen '+S(soMargin(s)),d:s.giDate||s.date});
    }else if(s.status==='Anulado'){
      nodes.push({n:'Anulado',t:'Pedido anulado antes del despacho · motivo: '+esc(s.cancelReason||'—')+'. El lote reservado quedó libre y no hubo movimiento de stock.',d:s.cancelDate});
    }else if(s.status==='Devuelto'){
      nodes.push({n:s.returnDoc,t:'Devolución · entrada 202 · motivo: '+esc(s.returnReason||'—')+' · '+N(s.qty)+' pouch repuestos al lote de origen',d:s.returnDate});
      nodes.push({n:'Resultado',t:'Venta anulada por devolución: no cuenta en ingresos ni margen del periodo.',d:s.returnDate});
    }else{
      nodes.push({n:'Pendiente',t:'Sin salida de mercancía: el stock sigue reservado y el margen no se reconoce.',d:''});
    }
  }
  return head('ZFLW')+`<div class="card"><header><h4 class="mono">${esc(id)}</h4><span class="hint">Cadena de documentos</span></header>
  <div class="body"><div class="flow">
  ${nodes.map((n,i)=>`<div class="flownode"><div class="flowrail"><span class="flowdot" style="${n.sub?'background:var(--matcha-300)':''}"></span>${i<nodes.length-1?'<span class="flowline"></span>':''}</div>
  <div class="flowbody"><div class="n mono">${esc(n.n)}</div><div class="t">${esc(n.t)}${n.d?' · '+fdate(n.d):''}</div></div></div>`).join('')}
  </div></div></div>`;
}

/* ---------------- MD04 ---------------- */
function planning(){
  const vel=velocity(), stock=stockTotal();
  const transit=openPO().reduce((t,p)=>t+p.qty,0);
  const ss=CFG.stockMin;
  const rop=vel*CFG.leadTime+ss;
  const dso=vel>0?stock/vel:999;
  const out=new Date(TODAY);out.setDate(out.getDate()+Math.floor(dso));
  const need=Math.max(0,Math.ceil(vel*(CFG.leadTime+CFG.cobertura)+ss-(stock+transit)));
  const weeks=[];
  for(let i=0;i<=8;i++){
    const d=new Date(TODAY);d.setDate(d.getDate()+i*7);
    const iso=d.toISOString().slice(0,10);
    const rec=openPO().filter(p=>{const a=new Date(p.date);a.setDate(a.getDate()+CFG.leadTime);return a.toISOString().slice(0,10)<=iso}).reduce((t,p)=>t+p.qty,0);
    weeks.push({iso,label:i===0?'hoy':'S+'+i,qty:Math.round(stock-vel*7*i+rec)});
  }
  return {vel,stock,transit,ss,rop,dso,outDate:out.toISOString().slice(0,10),need,weeks};
}
function md04(){
  const p=planning();
  const max=Math.max(p.stock,p.rop,...p.weeks.map(w=>Math.abs(w.qty)),1);
  return head('MD04','Punto de pedido = consumo diario × plazo de entrega + stock de seguridad. Todo se calcula con tu propio ritmo de venta, no con supuestos.')+`
  ${p.stock<=p.rop?`<div class="note bad"><b>Stock por debajo del punto de pedido.</b> Tienes ${N(p.stock)} pouches y el punto de pedido está en ${N(p.rop,1)}. Rotura estimada el ${fdate(p.outDate)}.</div>`

    <div class="kpi"><div class="l">Punto de pedido</div><div class="v">${N(p.rop,1)}</div><div class="d">${CFG.leadTime} días de plazo + ${p.ss} de seguridad</div></div>

  <div class="card"><header><h4>Proyección de stock a 8 semanas</h4>

  </div></div>

function csv(kind){
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  if(kind==='ventas')return ['Pedido,Fecha,Cliente,Telefono,Canal,Tipo,Distrito,Pago,Cantidad,PrecioUnit,Descuento,VentaNeta,CostoLotes,Delivery,Margen,Estado,Entrega,Lotes']
    .concat(state.so.map(s=>[s.id,s.date,q(s.customer),s.phone,q(s.channel),s.type,q(s.district),q(s.payment),s.qty,s.price,s.discount||0,
      soNet(s).toFixed(2),soCost(s).toFixed(2),s.freight||0,soMargin(s).toFixed(2),s.status,s.dlDoc||'',q(s.alloc.map(a=>a.batch+':'+a.qty).join(' | '))].join(','))).join('\n');
  if(kind==='compras')return ['Pedido,Fecha,Proveedor,Cantidad,Recibido,PrecioUnit,Valor,Vencimiento,Lote,DocMaterial,Estado']
    .concat(state.po.map(p=>[p.id,p.date,q(p.supplier),p.qty,p.qtyRec||0,p.price,(p.qty*p.price).toFixed(2),p.expiry,
      p.status==='Recibido'?CFG.prefix+'-'+p.expiry.replace(/-/g,'')+'-'+p.ref:'',p.grDoc||'',p.status].join(','))).join('\n');
  if(kind==='lotes')return ['Lote,Pedido,Ingreso,Vencimiento,DiasParaVencer,Recibido,Vendido,Stock,Reservado,CostoUnit,Valor,Estado']
    .concat(batches().map(b=>[b.id,b.po,b.grDate,b.expiry,b.dte,b.received,b.issued,b.stock,b.reserved,b.cost,b.value.toFixed(2),b.expStatus].join(','))).join('\n');
  return ['Documento,Fecha,Tipo,Movimiento,Referencia,Lote,Interlocutor,Entrada,Salida,CostoUnit,Importe,Saldo,ValorSaldo']
    .concat(kardex().map(r=>[r.doc,r.date,r.type,r.mvt,r.ref,r.batch,q(r.partner),r.inQty,r.outQty,r.unit,r.value.toFixed(2),r.bal,r.balValue.toFixed(2)].join(','))).join('\n');
}
async function exportData(kind){
  const json=kind==='json';
  const text=json?JSON.stringify(state,null,1):csv(kind);
  const name='matchi-'+kind+'-'+TODAY+(json?'.json':'.csv');
  const out=el('z_out');if(out)out.value=text;
  try{
    const blob=new Blob([json?text:'\ufeff'+text],{type:(json?'application/json':'text/csv')+';charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},1500);
    return msg('Archivo <b>'+name+'</b> descargado.');
  }catch(e){}
  msg('Exportación lista abajo, en el cuadro de texto. Cópiala y pégala en un archivo '+(json?'.json':'.csv')+'.');
}

/* ---------------- charts ---------------- */
function barChart(data){
  if(!data.length)return '<div class="empty">Sin datos.</div>';
  const W=720,H=210,pad={l:52,r:12,t:12,b:28};
  const max=Math.max(...data.map(d=>d.value))*1.15||1;
  const bw=(W-pad.l-pad.r)/data.length;
  const y=v=>pad.t+(H-pad.t-pad.b)*(1-v/max);
  const ticks=[0,max/2,max];
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Venta neta por día">
  ${ticks.map(t=>`<line x1="${pad.l}" x2="${W-pad.r}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/>
   <text x="${pad.l-8}" y="${y(t)+4}" text-anchor="end" font-size="10" fill="var(--ink-soft)" font-family="IBM Plex Mono">${Math.round(t)}</text>`).join('')}
  ${data.map((d,i)=>{const h=Math.max(1,(H-pad.t-pad.b)*(d.value/max));
    return `<rect x="${pad.l+i*bw+bw*0.18}" y="${H-pad.b-h}" width="${bw*0.64}" height="${h}" rx="2" fill="var(--matcha-500)"/>
    <text x="${pad.l+i*bw+bw/2}" y="${H-pad.b+14}" text-anchor="middle" font-size="9.5" fill="var(--ink-soft)" font-family="IBM Plex Mono">${d.label}</text>`}).join('')}
  </svg><div class="legend"><span><i style="background:var(--matcha-500)"></i>Venta neta del día (${CFG.currency})</span></div>`;
}
function waterfall(items){
  const W=720,H=240,pad={l:58,r:12,t:16,b:44};
  const max=Math.max(...items.map(i=>Math.abs(i.value)))*1.25||1;
  const bw=(W-pad.l-pad.r)/items.length;
  const base=H-pad.b, scale=(H-pad.t-pad.b)/max;
  let run=0;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Del ingreso al margen">
  <line x1="${pad.l}" x2="${W-pad.r}" y1="${base}" y2="${base}" stroke="var(--line)"/>
  ${items.map((it,i)=>{
    const x=pad.l+i*bw+bw*.18, w=bw*.64;
    let y0,h,fill;
    if(it.type==='pos'){h=it.value*scale;y0=base-h;run=it.value;fill='var(--matcha-600)'}
    else if(it.type==='neg'){h=Math.abs(it.value)*scale;y0=base-run*scale;run=run+it.value;fill='var(--coral)'}
    else{h=it.value*scale;y0=base-h;fill='var(--matcha-800)'}
    return `<rect x="${x}" y="${y0}" width="${w}" height="${Math.max(2,h)}" rx="2" fill="${fill}"/>
    <text x="${x+w/2}" y="${y0-6}" text-anchor="middle" font-size="11" font-weight="600" fill="var(--ink)" font-family="IBM Plex Mono">${(it.value<0?'−':'')+Math.abs(it.value).toFixed(2)}</text>
    <text x="${x+w/2}" y="${base+18}" text-anchor="middle" font-size="10.5" fill="var(--ink-soft)">${it.label}</text>`}).join('')}
  </svg>`;
}

  const so=el('do_so');
  if(so)so.onclick=()=>{
    const cust=el('s_cust').value.trim(),date=el('s_date').value,qty=Number(el('s_qty').value),price=Number(el('s_price').value);
    if(!cust||!date||!(qty>0)||!(price>=0))return msg('Completa cliente, fecha, cantidad y precio.','err');
    const r=fefo(qty,date);
    state.counters.so++;
    const id='10'+pad(state.counters.so,8);

      note:el('s_note').value.trim(),alloc:r.alloc.map(a=>({batch:a.batch,qty:a.qty})),status:'Pendiente'});

    go('VL01N');

    const d=document.querySelector('[data-gid="'+s.id+'"]').value;
    if(d<s.date)return msg('La salida no puede ser anterior al pedido.','err');
    for(const a of s.alloc){const bt=batchById(a.batch);if(!bt||bt.stock<a.qty)return msg('El lote '+a.batch+' ya no tiene stock suficiente. Redetermina.','err')}
    state.counters.dl++;state.counters.gi++;
    s.status='Entregado';s.giDate=d;
    s.dlDoc='80'+pad(state.counters.dl,8);s.giDoc='49'+pad(state.counters.gi,8);
    save();
    msg('Entrega <b>'+s.dlDoc+'</b> despachada · salida '+s.giDoc+' · costo '+S(soCost(s))+' · margen '+S(soMargin(s))+'.');
    go('VL06O');
  });
}

  await connect();

})();
</script>
